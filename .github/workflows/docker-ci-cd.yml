name: Selenium Tests - Docker CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build Docker image
        run: docker build -t selenium-tests:${{ matrix.browser }}-latest .
      
      - name: Run ${{ matrix.browser }} tests
        run: |
          docker run --rm \
            -e browser=${{ matrix.browser }} \
            -v ${{ github.workspace }}/target:/app/target \
            selenium-tests:${{ matrix.browser }}-latest
        continue-on-error: true
      
      - name: Upload Cucumber Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-${{ matrix.browser }}
          path: target/cucumber-reports/
          retention-days: 30
      
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: target/screenshots/
          retention-days: 7
      
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.browser }}
          path: target/logs/
          retention-days: 7

  test-summary:
    runs-on: ubuntu-latest
    needs: build-matrix
    if: always()
    
    steps:
      - name: Test Summary
        run: |
          echo "## 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Multi-Browser Testing" >> $GITHUB_STEP_SUMMARY
          echo "- Browsers Tested: Chrome, Firefox" >> $GITHUB_STEP_SUMMARY
          echo "- Parallel Threads: 3" >> $GITHUB_STEP_SUMMARY
          echo "- Build Date: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Reports Generated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cucumber Reports (HTML)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Screenshots on Failure" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Test Logs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Available" >> $GITHUB_STEP_SUMMARY
          echo "- cucumber-reports-chrome" >> $GITHUB_STEP_SUMMARY
          echo "- cucumber-reports-firefox" >> $GITHUB_STEP_SUMMARY
          echo "- screenshots-chrome" >> $GITHUB_STEP_SUMMARY
          echo "- screenshots-firefox" >> $GITHUB_STEP_SUMMARY
          echo "- logs-chrome" >> $GITHUB_STEP_SUMMARY
          echo "- logs-firefox" >> $GITHUB_STEP_SUMMARY
