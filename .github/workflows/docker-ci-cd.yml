name: Selenium Tests - Docker CI/CD (Advanced)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
        test-suite: [ui, api, integration]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build Docker image
        run: docker build -t selenium-tests:${{ matrix.browser }}-latest .
      
      - name: Run ${{ matrix.browser }} tests - ${{ matrix.test-suite }}
        run: |
          docker run --rm \
            -e browser=${{ matrix.browser }} \
            -e TEST_SUITE=${{ matrix.test-suite }} \
            -v ${{ github.workspace }}/target:/app/target \
            selenium-tests:${{ matrix.browser }}-latest
        continue-on-error: true
      
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report
      
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}-${{ matrix.test-suite }}
          path: target/allure-report/
          retention-days: 30
      
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-${{ matrix.browser }}-${{ matrix.test-suite }}
          path: target/cucumber-reports/
          retention-days: 30
      
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.test-suite }}
          path: target/screenshots/
          retention-days: 7
      
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.browser }}-${{ matrix.test-suite }}
          path: target/logs/
          retention-days: 7

  parallel-execution:
    runs-on: ubuntu-latest
    needs: build-matrix
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Parallel Tests (3 threads)
        run: mvn clean test -DthreadCount=3 -Dparallel=all
        continue-on-error: true
      
      - name: Generate Consolidated Report
        if: always()
        run: |
          mvn allure:report
          mvn post-site -DskipDeploy=true
      
      - name: Upload Consolidated Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-reports
          path: |
            target/allure-report/
            target/cucumber-reports/
            target/site/
          retention-days: 30
      
      - name: Test Summary
        if: always()
        run: |
          echo "## 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Matrix Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Browsers: Chrome, Firefox" >> $GITHUB_STEP_SUMMARY
          echo "- Test Suites: UI, API, Integration" >> $GITHUB_STEP_SUMMARY
          echo "- Total Combinations: 6" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Parallel Execution" >> $GITHUB_STEP_SUMMARY
          echo "- Threads: 3" >> $GITHUB_STEP_SUMMARY
          echo "- Build Date: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Reports Generated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Allure Reports" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cucumber Reports" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Screenshots" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Logs" >> $GITHUB_STEP_SUMMARY
