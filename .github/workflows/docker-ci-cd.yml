name: Selenium Tests - Docker CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build Docker image
        run: docker build -t selenium-tests:latest .
      
      - name: Run Chromium tests in Docker
        run: |
          docker run --rm \
            -e browser=chrome \
            -e headless.mode=true \
            -v ${{ github.workspace }}/target:/app/target \
            selenium-tests:latest \
            mvn clean test -Dheadless.mode=true -Dbrowser=chrome
        continue-on-error: true
      
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report -DskipTests || true
      
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report/
          retention-days: 30
      
      - name: Upload Cucumber Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: target/cucumber-reports/
          retention-days: 30
      
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots/
          retention-days: 7
      
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: target/logs/
          retention-days: 7

  test-summary:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    
    steps:
      - name: Test Summary
        run: |
          echo "## 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CI/CD Testing" >> $GITHUB_STEP_SUMMARY
          echo "- Browser: Chromium (in Docker)" >> $GITHUB_STEP_SUMMARY
          echo "- Parallel Threads: 3" >> $GITHUB_STEP_SUMMARY
          echo "- Headless Mode: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
          echo "- Build Date: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Local Testing (Optional)" >> $GITHUB_STEP_SUMMARY
          echo "Test with Firefox locally:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "mvn test -Dbrowser=firefox -Dheadless.mode=true" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Reports Generated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Allure Reports (Advanced)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cucumber Reports (HTML)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Screenshots on Failure" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Test Logs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Available" >> $GITHUB_STEP_SUMMARY
          echo "- allure-report" >> $GITHUB_STEP_SUMMARY
          echo "- cucumber-reports" >> $GITHUB_STEP_SUMMARY
          echo "- screenshots" >> $GITHUB_STEP_SUMMARY
          echo "- logs" >> $GITHUB_STEP_SUMMARY
